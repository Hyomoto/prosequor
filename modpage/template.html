<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Prosequor Mod Page Mockup</title>

    <style>
        body {
            margin: 0;
            background: #f5f1e8;
            color: #201b16;
            font-family: Verdana, "Times New Roman", serif;
            font-size: 18px;
            line-height: 1.55;
        }

        main {
            max-width: 1180px;
            padding: 20px 10px;
        }

        h1,
        h2,
        h3 {
            font-family: Verdana, "Times New Roman", serif;
            line-height: 1.0;
        }

        h1 {
            font-size: 2.4rem;
            margin-bottom: 0.3em;
        }

        h2 {
            font-size: 1.65rem;
            margin-top: 2.2em;
            margin-bottom: 0.7em;
        }

        h3 {
            font-size: 1.15rem;
            margin-top: 1.7em;
            margin-bottom: 0.4em;
            color: #1c648b;
        }

        p {
            margin: 0.8em 0;
        }

        ul {
            margin-top: 0.5em;
        }

        li {
            margin: 0.35em 0;
        }

        a {
            color: #1c648b;
        }

        hr {
            border: 0;
            border-top: 1px solid #acb9cb;
            margin: 2.5em 0;
        }

        details {
            margin: 0.45em 0;
            border: 1px solid #acb9cb;
            border-radius: 4px;
            background: #e4ebf4;
        }

        summary {
            cursor: pointer;
            padding: 0.55em 0.8em;
            font-weight: bold;
        }

        details > *:not(summary) {
            margin-left: 1em;
            margin-right: 1em;
        }

        details > p:last-child,
        details > ul:last-child {
            margin-bottom: 1em;
        }

        .lead {
            font-size: 1.08em;
        }

        .notice {
            border-left: 4px solid #8b2f1c;
            padding: 0.8em 1em;
            background: rgba(139, 47, 28, 0.06);
        }

        .muted {
            color: #6f665a;
        }
    </style>
</head>

<body>
  <main>
{body}
  </main>
</body>
</html>
